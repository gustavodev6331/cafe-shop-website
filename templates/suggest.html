{% from 'bootstrap5/form.html' import render_form %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Suggest a Cafe</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body style="background-color: #f8f9fa;">

    <div class="container mt-5 mb-5" style="max-width: 700px;">
        <div class="card shadow-sm">
            <div class="card-body p-4">

                <h1 class="text-center mb-3">Suggest a Cafe</h1>

                <p class="text-center text-muted mb-4">
                    Know a great coffee shop? Suggest it here!
                    Every submission will be reviewed by the site owner
                    before it appears on the website.
                </p>

                {{ render_form(form, button_style="primary") }}

                <div class="text-center mt-3">
                    <a href="{{ url_for('home') }}" class="btn btn-outline-secondary">
                        Back to cafes
                    </a>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
